[project]
name = "spotify-review-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dashboard = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=9.1.1",
]
